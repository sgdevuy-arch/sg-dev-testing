<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Salón de Belleza</title>
    <style>
        /* Variables de Paleta de Colores Suaves y Pasteles */
        :root {
            --bg-principal: #fbf9f6;
            --blanco: #ffffff;
            --texto-oscuro: #4a433f;
            --texto-mutado: #8e857e;
            --primario-pastel: #e3d5ca;
            --primario-enfoque: #d5bdaf;
            --borde-suave: #f0eae4;
            --rosa-viejo: #b79492;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-oscuro);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-card {
            background-color: var(--blanco);
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(183, 148, 146, 0.08);
            overflow: hidden;
            border: 1px solid var(--borde-suave);
        }

        /* Banner Superior Estilizado */
        .banner {
            background-color: #f5ebe6;
            padding: 40px 30px;
            text-align: center;
            border-bottom: 1px solid var(--borde-suave);
        }

        .banner h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--texto-oscuro);
        }

        .banner p {
            margin: 0;
            font-size: 14px;
            color: var(--texto-mutated);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Cuerpo del Formulario */
        .content {
            padding: 40px 30px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--rosa-viejo);
            margin-bottom: 15px;
            display: block;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 500px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--texto-oscuro);
        }

        input, select {
            padding: 14px;
            border: 1px solid var(--borde-suave);
            border-radius: 12px;
            background-color: #faf8f6;
            color: var(--texto-oscuro);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primario-enfoque);
            background-color: var(--blanco);
            box-shadow: 0 0 0 4px rgba(213, 189, 175, 0.15);
        }

        /* Selector de Servicios en Tarjetas Visuales */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .service-option {
            border: 1px solid var(--borde-suave);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            background-color: var(--blanco);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .service-option:hover {
            border-color: var(--primario-enfoque);
            transform: translateY(-2px);
            background-color: #fdfbf9;
        }

        /* Truco CSS para manejar la selección sin Javascript complejo */
        .service-option input[type="radio"] {
            display: none;
        }

        .service-option .icon {
            font-size: 22px;
            margin-bottom: 8px;
            display: block;
        }

        .service-option span {
            font-size: 13px;
            font-weight: 500;
            display: block;
        }

        .service-option .price {
            font-size: 12px;
            color: var(--texto-mutado);
            margin-top: 4px;
        }

        /* Estado seleccionado */
        .service-option:has(input[type="radio"]:checked) {
            border-color: var(--rosa-viejo);
            background-color: #f9f2f1;
            box-shadow: 0 4px 12px rgba(183, 148, 146, 0.15);
        }

        /* Botón de Acción */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--rosa-viejo);
            color: var(--blanco);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(183, 148, 146, 0.2);
        }

        .btn-submit:hover {
            background-color: #a3807e;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(183, 148, 146, 0.3);
        }

        /* footer de Contacto e Información */
        .footer-info {
            background-color: #fbf9f6;
            padding: 30px;
            border-top: 1px solid var(--borde-suave);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .info-block h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--texto-mutado);
            margin: 0 0 8px 0;
        }

        .info-block p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            color: var(--texto-oscuro);
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- Encabezado con estética de salón moderno -->
    <div class="banner">
        <h1>NINA STUDIO</h1>
        <p>Reserva de Turnos Online</p>
    </div>

    <form action="#" method="POST">
        <div class="content">
            
            <!-- Datos Básicos -->
            <span class="section-title">1. Tus Datos</span>
            <div class="grid-inputs">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono celular</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="099 123 456" required>
                </div>
            </div>

            <!-- Selección de Servicios en Tarjetas -->
            <span class="section-title">2. Selecciona el Servicio</span>
            <div class="services-grid">
                <label class="service-option">
                    <input type="radio" name="servicio" value="corte" checked>
                    <span class="icon">✂️</span>
                    <span>Corte Estilo</span>
                    <span class="price">$850</span>
                </label>
                
                <label class="service-option">
                    <input type="radio" name="servicio" value="color">
                    <span class="icon">✨</span>
                    <span>Color & Brillo</span>
                    <span class="price">$1.800</span>
                </label>

                <label class="service-option">
                    <input type="radio" name="servicio" value="peinado">
                    <span class="icon">💨</span>
                    <span>Peinado / Brushing</span>
                    <span class="price">$600</span>
                </label>

                <label class="service-option">
                    <input type="radio" name="servicio" value="Tratamiento">
                    <span class="icon">🌿</span>
                    <span>Nutrición Capilar</span>
                    <span class="price">$1.200</span>
                </label>
            </div>

            <!-- Profesional y Horarios -->
            <span class="section-title">3. Fecha, Hora y Estilista</span>
            <div class="grid-inputs">
                <div class="form-group">
                    <label for="estilista">Elegir Profesional</label>
                    <select id="estilista" name="estilista">
                        <option value="cualquiera">Cualquier profesional disponible</option>
                        <option value="valeria">Valeria Silva (Especialista en Color)</option>
                        <option value="bruno">Bruno Costa (Estilista Senior)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha y Hora</label>
                    <!-- Agrupado en un único campo moderno o separado -->
                    <div style="display: flex; gap: 8px;">
                        <input type="date" id="fecha" name="fecha" style="width: 60%;" required>
                        <input type="time" id="hora" name="hora" style="width: 40%;" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Confirmar mi Turno</button>
        </div>
    </form>

    <!-- Datos de Contacto Estilizados como el footer de la tarjeta -->
    <div class="footer-info">
        <div class="info-block">
            <h3>Ubicación</h3>
            <p>Av. Luis Alberto de Herrera 2410<br>Montevideo, Uruguay</p>
        </div>
        <div class="info-block">
            <h3>Contacto Directo</h3>
            <p>WhatsApp: 099 876 543<br>Fijo: 2400 1234</p>
        </div>
        <div class="info-block">
            <h3>Atención</h3>
            <p>Martes a Sábados<br>09:00 a 19:30 hs</p>
        </div>
    </div>
</div>

</body>
</html>
