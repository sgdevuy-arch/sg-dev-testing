    <meta name="keywords" content="SG Analyzer, testing web, análisis SEO, performance web, optimización web, accesibilidad web, auditoría web" />

    <meta name="author" content="SG Dev" />

    <meta name="robots" content="index, follow">

    <meta name="language" content="es">

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="SG Analyzer | Testing y análisis web">

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="SG Analyzer">

    <meta name="twitter:description" content="Analiza rendimiento, SEO y accesibilidad de cualquier sitio web.">

    <meta name="twitter:image" content="https://sgdevuy-arch.github.io/sg-dev-testing/logo2.png">

    <!-- CSS -->
    <link rel="stylesheet" href="nuevo1.css">

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

    <div class="logo">
        SG <span>Dev & Testing</span>
    </div>

    <button class="menu-toggle" id="menu-toggle">☰</button>

    <nav class="nav-links" id="nav-links">

        <a href="index.html">Inicio</a>

        <a href="nuestroTrabajo.html">Proyectos</a>

        <a href="servicios.html">Servicios</a>

        <a href="analizador.html">SG Analyzer</a>

        <a href="contacto.html">Contacto</a>

    </nav>

</header>

<!-- ANALIZADOR -->
<div class="analizador">

    <!-- TEXTO SEO -->
    <div class="analyzer-hero">

        <h1>SG Analyzer</h1>

        <p>
            Analiza rendimiento, SEO, accesibilidad y optimización de cualquier sitio web en segundos.
        </p>

    </div>

    <h2>Analiza tu sitio web</h2>

    <div class="input-analyzer">

    <input type="text" id="urlInput" placeholder="https://tusitio.com">

    <button onclick="analizar()">Analizar</button>

</div>

    <div id="loader" class="loader oculto">
        🔍 Analizando...
    </div>

    <p id="loaderTexto" class="loader-texto"></p>

    <h3 class="titulo-graficos">
        📊 Análisis detallado del sitio
    </h3>

    <div id="resultado" class="glass oculto"></div>

    <div class="grid-graficos">

        <canvas id="chartPerformance"></canvas>

        <canvas id="chartSEO"></canvas>

        <canvas id="chartAccessibility"></canvas>

        <canvas id="chartHTML"></canvas>

        <canvas id="chartCSS"></canvas>

        <canvas id="chartImages"></canvas>

    </div>

</div>

<div id="recomendaciones"></div>

<div id="problemas" class="problemas-box"></div>
